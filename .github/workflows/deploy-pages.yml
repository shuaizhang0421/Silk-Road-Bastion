name: Deploy Silk Road Bastion to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit asset licenses
        run: pnpm test:assets
      - name: Simulate endless balance
        run: pnpm test:sim
      - name: Validate closed-loop difficulty policies
        run: pnpm test:difficulty
      - name: Test save migration
        run: pnpm test:save
      - name: Test responsive UI contract
        run: pnpm test:ui
      - name: Test four region bundles
        run: pnpm test:regions
      - name: Test onboarding flow
        run: pnpm test:onboarding
      - name: Test model geometry contracts
        run: pnpm test:geometry
      - name: Test visual asset contracts
        run: pnpm test:visual-assets
      - name: Test audio contracts
        run: pnpm test:audio
      - name: Install screenshot browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test responsive screenshots and scene geometry
        run: pnpm test:e2e
      - name: Build static game
        run: pnpm build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
